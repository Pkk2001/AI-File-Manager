name: CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore and Build backend/FileManager.Core
        run: |
          dotnet restore backend/FileManager.Core/FileManager.Core.csproj
          dotnet build backend/FileManager.Core/FileManager.Core.csproj --configuration Release --no-restore

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_engine/requirements.txt

      - name: Verify Python syntax
        run: |
          python -m py_compile ai_engine/ai_agent.py ai_engine/categorizer.py
